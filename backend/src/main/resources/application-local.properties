# Local Database Configuration Template
# 
# To use your own database:
# 1. Replace the placeholders below with your actual database credentials
# 2. In application.properties, change: spring.profiles.active=local


spring.datasource.url=jdbc:mysql://your-database-host:port/your-database?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=your-username
spring.datasource.password=your-password
