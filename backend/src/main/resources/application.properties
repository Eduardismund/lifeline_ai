spring.application.name=lifeline-ai-backend

# Profile selection: 
# - 'dev' = configuration I used to connect to my database (not available on this git repository)
# - 'local' = use your own database (edit credentials in application-local.properties first)
spring.profiles.active=dev

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

logging.level.root=INFO
logging.level.com.lifelineai.backend=DEBUG

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000